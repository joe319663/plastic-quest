
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#176b50">
<title>Plastic Quest｜管理中心</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;padding:18px;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  background:#f1f5f2;color:#203b30
}
.container{max-width:1050px;margin:auto}
header{
  background:linear-gradient(135deg,#145c45,#278565);
  color:white;padding:25px;border-radius:19px;margin-bottom:18px;
  box-shadow:0 5px 18px #176b5018
}
header h1{margin:0 0 7px;font-size:26px}
header p{margin:0;font-size:13px;opacity:.88}
.panel{
  background:white;padding:19px;border-radius:17px;
  margin-bottom:16px;box-shadow:0 3px 12px #183b3010
}
h2{font-size:18px;margin:0 0 15px}
input{
  width:100%;padding:13px;border:1px solid #ccd8d0;
  border-radius:10px;font-size:16px;margin:10px 0
}
button{
  border:0;border-radius:10px;padding:12px 17px;
  background:#176b50;color:white;font-size:14px;font-weight:bold
}
button:disabled{opacity:.5}
button.light{background:#e7efe9;color:#176b50}
.status{font-size:12px;color:#718278;margin-top:10px;line-height:1.6}
.hidden{display:none!important}
.grid{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px
}
.stat{
  padding:18px;border-radius:14px;
  background:#edf6f0;border:1px solid #e0eee4
}
.stat strong{
  display:block;font-size:31px;margin:8px 0 5px;
  color:#176b50;font-weight:800
}
.stat small{color:#66766c;font-size:12px}
.stat span{font-size:11px;color:#7b887f}
.section-title{margin:23px 2px 12px}
.notice{
  padding:13px 15px;border-radius:11px;
  background:#fff6e8;color:#92651f;
  font-size:12px;line-height:1.7;margin-bottom:16px
}
.chart-wrap{height:310px;position:relative}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:380px;font-size:13px}
th,td{
  padding:11px 8px;text-align:left;
  border-bottom:1px solid #edf0ed;white-space:nowrap
}
th{color:#718278}
.topline{
  display:flex;justify-content:space-between;
  align-items:center;gap:12px;flex-wrap:wrap
}
@media(min-width:700px){
  .grid{grid-template-columns:repeat(4,minmax(0,1fr))}
  body{padding:25px}
}
</style>
</head>

<body>
<div class="container">

<header>
  <h1>🌱 Plastic Quest</h1>
  <p>七天減塑挑戰｜管理數據中心</p>
</header>

<section class="panel" id="loginPanel">
  <h2>🔐 管理者登入</h2>
  <p style="font-size:13px;color:#718278">
    輸入管理密碼以查看平台累積成果。
  </p>
  <input id="password" type="password" placeholder="管理密碼">
  <button id="loginBtn">登入管理中心</button>
  <div class="status" id="loginStatus"></div>
</section>

<main id="dashboard" class="hidden">

  <section class="panel">
    <div class="topline">
      <div>
        <h2 style="margin:0 0 5px">📊 成果總覽</h2>
        <div class="status" id="updateTime">尚未更新</div>
      </div>
      <div style="display:flex;gap:7px">
        <button class="light" id="refreshBtn">↻ 更新</button>
        <button id="logoutBtn">登出</button>
      </div>
    </div>
  

  <div class="section-title">
    <h2>👥 累積參與成果</h2>
  </div>

  <div class="grid">
    <div class="stat">
      <small>累積參與玩家</small>
      <strong id="totalPlayers">—</strong>
      <span>位</span>
    </div>
    <div class="stat">
      <small>累積紀錄</small>
      <strong id="totalRecords">—</strong>
      <span>筆</span>
    </div>
    <div class="stat">
      <small>吸管減量</small>
      <strong id="totalStraws">—</strong>
      <span>支</span>
    </div>
    <div class="stat">
      <small>塑膠袋減量</small>
      <strong id="totalBags">—</strong>
      <span>個</span>
    </div>
  </div>

  <section class="panel" style="margin-top:22px">
    <h2>📈 每日減塑成果趨勢</h2>
    <div style="display:flex;gap:15px;flex-wrap:wrap;font-size:12px;margin-bottom:14px">
      <span>🟢 吸管減量</span>
      <span>🔵 塑膠袋減量</span>
    </div>
    <div class="chart-wrap">
      <canvas id="dailyChart"></canvas>
      <div id="chartError" class="hidden status">
        圖表載入失敗，請確認網路連線。
      </div>
    </div>
  </section>

  <section class="panel">
    <h2>📝 玩家每日紀錄</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>玩家暱稱</th>
            <th>日期</th>
            <th>吸管減量</th>
            <th>塑膠袋減量</th>
          </tr>
        </thead>
        <tbody id="recentRows">
          <tr><td colspan="4">尚無資料</td></tr>
        </tbody>
      </table>
    </div>
    <div class="status" id="recordCount"></div>
  </section>

  <div class="status" id="dataStatus">
    每 15 秒自動更新一次。
  </div>
</main>

</div>

<script>
const SUPABASE_URL =
  "https://sidwuvfdzqhohhgtbmfq.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_BUVBbYbLp8PNU5WTf5YPkw_Ltjlq5uX";

const client=window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let adminPassword="";
let refreshTimer=null;
let chart=null;
let recentData=[];

const $=id=>document.getElementById(id);

function number(id,value){
  $(id).textContent=
    Number(value??0).toLocaleString("zh-TW");
}

function normalizeData(data){
  if(typeof data==="string"){
    data=JSON.parse(data);
  }

  if(Array.isArray(data)&&data.length===1){
    data=data[0];
  }

  if(!data||typeof data!=="object"){
    throw new Error("資料庫沒有回傳有效資料");
  }

  const required=[
    "real_players","demo_players",
    "real_records","demo_records",
    "real_straws","real_bags",
    "demo_straws","demo_bags"
  ];

  const missing=required.filter(
    key=>!(key in data)
  );

  if(missing.length){
    throw new Error("缺少資料欄位："+missing.join(", "));
  }

  if(!Array.isArray(data.daily)||
     !Array.isArray(data.recent)){
    throw new Error("每日趨勢或紀錄格式錯誤");
  }

  return data;
}

function drawChart(rows){
  $("chartError").classList.add("hidden");

  if(typeof Chart==="undefined"){
    $("chartError").classList.remove("hidden");
    return;
  }

  const labels=rows.map(x=>x.record_date);

  const datasets=[
    {
      label:"吸管減量",
      data:rows.map(x=>
        Number(x.real_straws||0)+Number(x.demo_straws||0)
      ),
      backgroundColor:"#279b70",
      borderRadius:5
    },
    {
      label:"塑膠袋減量",
      data:rows.map(x=>
        Number(x.real_bags||0)+Number(x.demo_bags||0)
      ),
      backgroundColor:"#4285c5",
      borderRadius:5
    }
  ];

  if(chart)chart.destroy();

  chart=new Chart($("dailyChart"),{
    type:"bar",
    data:{labels,datasets},
    options:{
      responsive:true,
      maintainAspectRatio:false,
      interaction:{mode:"index",intersect:false},
      plugins:{legend:{display:false}},
      scales:{
        x:{ticks:{maxRotation:45,minRotation:0}},
        y:{beginAtZero:true,ticks:{precision:0}}
      }
    }
  });
}

function renderRecent(){
  const tbody=$("recentRows");
  tbody.replaceChildren();

  if(!recentData.length){
    const tr=document.createElement("tr");
    const td=document.createElement("td");
    td.colSpan=4;
    td.textContent="目前沒有紀錄";
    tr.appendChild(td);
    tbody.appendChild(tr);
  }else{
    recentData.forEach(item=>{
      const tr=document.createElement("tr");

      const values=[
        item.nickname,
        item.record_date,
        Number(item.straws_saved||0)+" 支",
        Number(item.bags_saved||0)+" 個"
      ];

      values.forEach(value=>{
        const td=document.createElement("td");
        td.textContent=value??"";
        tr.appendChild(td);
      });

      tbody.appendChild(tr);
    });
  }

  $("recordCount").textContent=
    "目前顯示 "+recentData.length+" 筆｜最近紀錄";
}

function renderData(rawData){
  const data=normalizeData(rawData);

  const totalPlayers=
    Number(data.real_players||0)+Number(data.demo_players||0);

  const totalRecords=
    Number(data.real_records||0)+Number(data.demo_records||0);

  const totalStraws=
    Number(data.real_straws||0)+Number(data.demo_straws||0);

  const totalBags=
    Number(data.real_bags||0)+Number(data.demo_bags||0);

  number("totalPlayers",totalPlayers);
  number("totalRecords",totalRecords);
  number("totalStraws",totalStraws);
  number("totalBags",totalBags);

  drawChart(data.daily);
  recentData=data.recent;
  renderRecent();

  $("updateTime").textContent=
    "最後更新："+new Date().toLocaleTimeString("zh-TW");
}

async function fetchDashboard(){
  const {data,error}=await client.rpc(
    "get_admin_dashboard",
    {p_password:adminPassword}
  );

  if(error)throw new Error(error.message);

  renderData(data);
}

async function loadDashboard(){
  $("dataStatus").textContent="正在更新資料……";
  $("refreshBtn").disabled=true;

  try{
    await fetchDashboard();
    $("dataStatus").textContent=
      "✓ 更新成功｜每 15 秒自動同步資料庫";
  }catch(error){
    $("dataStatus").textContent=
      "⚠ 更新失敗："+error.message;
  }

  $("refreshBtn").disabled=false;
}

$("loginBtn").addEventListener("click",async()=>{
  const password=$("password").value.trim();

  if(!password){
    $("loginStatus").textContent="請輸入管理密碼";
    return;
  }

  $("loginBtn").disabled=true;
  $("loginStatus").textContent="正在驗證……";

  try{
    const {data,error}=await client.rpc(
      "get_admin_dashboard",
      {p_password:password}
    );

    if(error)throw new Error(error.message);

    const checkedData=normalizeData(data);

    adminPassword=password;

    $("loginPanel").classList.add("hidden");
    $("dashboard").classList.remove("hidden");

    renderData(checkedData);

    if(refreshTimer)clearInterval(refreshTimer);

    refreshTimer=setInterval(loadDashboard,15000);

    $("dataStatus").textContent=
      "✓ 登入成功｜每 15 秒自動同步";
  }catch(error){
    $("loginStatus").textContent=
      "登入或讀取失敗："+error.message;
  }

  $("loginBtn").disabled=false;
});

$("refreshBtn").addEventListener("click",loadDashboard);

$("logoutBtn").addEventListener("click",()=>{
  adminPassword="";

  if(refreshTimer)clearInterval(refreshTimer);
  if(chart)chart.destroy();

  chart=null;
  $("password").value="";
  $("dashboard").classList.add("hidden");
  $("loginPanel").classList.remove("hidden");
  $("loginStatus").textContent="已登出";
});

$("password").addEventListener("keydown",event=>{
  if(event.key==="Enter")$("loginBtn").click();
});
</script>
</body>
</html>
